name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Pinned to the version in the Midnight compatibility matrix. The
      # compiler and the runtime have to match exactly, so this is not a
      # floating version.
      - name: Setup Compact compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      # npm's optional-dependency handling breaks the install before v11.
      # See https://github.com/npm/cli/issues/4828
      - name: Update npm
        run: npm install -g npm@latest

      # vite-plugin-wasm has not published its vite 7 support yet.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Compiles the circuits, type-checks, lints, builds, and runs the
      # tests - including the privacy invariant that scans the ledger for the
      # participant's secret. No proof server here: real proof generation is
      # slow and belongs in a deploy job, not on every push.
      #
      # The api, cli and ui packages still carry the scaffold's example logic.
      # They join this workflow as they are rewritten for Stele, so that a
      # green run always means something that actually exists passed.
      - name: Contract
        working-directory: contract
        run: npm run ci
