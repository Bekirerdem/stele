name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  stele:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Pinned: the compiler and the runtime have to match exactly.
      - name: Setup Compact compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.36.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # No proving keys and no network here: the simulator tests run the
      # compiled contract in memory, including the privacy invariant that scans
      # the public ledger for every secret and every answer text.
      - name: Compile (no ZK keys)
        run: npm run compile:fast

      - name: Type check
        run: npm run typecheck

      - name: Simulator tests
        run: npm run test:sim
